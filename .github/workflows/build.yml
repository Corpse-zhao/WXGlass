name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  #  Stage 1：静态自检（在 Linux 上跑，秒级完成，拦住低级错误）
  # ────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint 打包方案与架构字段
        run: |
          set -e
          echo "── Makefile 必须用 roothide 方案 ──"
          grep -q 'THEOS_PACKAGE_SCHEME = roothide' Makefile \
            || { echo "❌ Makefile 缺少 THEOS_PACKAGE_SCHEME = roothide"; exit 1; }

          echo "── control 架构必须是 iphoneos-arm64e ──"
          grep -q '^Architecture: iphoneos-arm64e' control \
            || { echo "❌ control 的 Architecture 不是 iphoneos-arm64e（roothide 设备会拒装）"; exit 1; }

          echo "── 双切片 ──"
          grep -q 'ARCHS = arm64 arm64e' Makefile \
            || { echo "❌ Makefile 必须 ARCHS = arm64 arm64e"; exit 1; }

      - name: Lint PreferenceLoader 入口 plist（entry 包裹）
        run: |
          set -e
          PLIST=Preferences/WXGlassEntry.plist
          echo "── $PLIST 必须含 <key>entry</key> ──"
          grep -q '<key>entry</key>' "$PLIST" \
            || { echo "❌ 入口 plist 缺少 entry 包裹 → PreferenceLoader 会静默跳过，设置里没有入口"; exit 1; }

          for k in bundle cell detail isController label; do
            grep -q "<key>$k</key>" "$PLIST" \
              || { echo "❌ entry 内缺少键：$k"; exit 1; }
          done

          echo "── entry 必须包在 dict 内（不能被摊平） ──"
          python3 - <<'PY'
          import plistlib, sys
          with open("Preferences/WXGlassEntry.plist","rb") as f:
              d = plistlib.load(f)
          if "entry" not in d:
              print("❌ 顶层没有 entry 键")
              sys.exit(1)
          e = d["entry"]
          for k in ("bundle","cell","detail","isController","label"):
              if k not in e:
                  print(f"❌ entry 内缺少 {k}")
                  sys.exit(1)
          if e.get("detail") != "WXGlassPrefsListController":
              print("❌ entry.detail 必须是 WXGlassPrefsListController")
              sys.exit(1)
          print("✅ 入口 plist 结构正确")
          PY

      - name: Lint bundle Info.plist（NSPrincipalClass）
        run: |
          set -e
          python3 - <<'PY'
          import plistlib, sys
          with open("Preferences/Resources/Info.plist","rb") as f:
              d = plistlib.load(f)
          pc = d.get("NSPrincipalClass","")
          if pc in ("", "PSListController"):
              print(f"❌ NSPrincipalClass 必须是控制器真实类名，当前='{pc}'")
              sys.exit(1)
          if pc != "WXGlassPrefsListController":
              print(f"❌ NSPrincipalClass 应为 WXGlassPrefsListController，当前='{pc}'")
              sys.exit(1)
          print(f"✅ NSPrincipalClass = {pc}")
          PY

      - name: Lint 版本号一致性（Tweak / Prefs / control）
        run: |
          set -e
          T=$(grep -oE 'WXG_VERSION @"[0-9.]+"' WXGCommon.h | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          P=$(grep -oE 'kDLPrefsVersion = @"[0-9.]+"' Preferences/WXGlassPrefs.mm | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          C=$(grep -E '^Version:' control | head -1 | awk '{print $2}')
          echo "Tweak=$T  Prefs=$P  control=$C"
          [ -n "$T" ] || { echo "❌ 没取到 WXG_VERSION"; exit 1; }
          [ "$T" = "$P" ] || { echo "❌ WXGCommon.h 与设置侧版本不一致（版本自检会误报）"; exit 1; }
          [ "$T" = "$C" ] || { echo "❌ control 版本与源码版本不一致"; exit 1; }
          # ⭐ bundle Info.plist 也必须同步（决定设置里显示的版本）
          I=$(grep -A1 'CFBundleShortVersionString' Preferences/Resources/Info.plist | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Info.plist=$I"
          [ "$T" = "$I" ] || { echo "❌ Preferences/Resources/Info.plist 版本与源码不一致"; exit 1; }
          # ⭐ CI 自身不许硬编码版本号（历史坑：升版后 Verify 假红）
          ! grep -qE 'Version: [0-9]+\.[0-9]+\.[0-9]+"' .github/workflows/build.yml \
            || { echo "❌ build.yml 里硬编码了版本号，应从 WXGCommon.h 推导"; exit 1; }
          echo "✅ 四处版本一致：$T"

      - name: Lint 禁止在 layoutSubviews 里改视图树（反馈环）
        run: |
          set -e
          # 提取三个 %hook 块，禁止其中出现 insertSubview / addSubview
          python3 - <<'PY'
          import re, sys
          src = open("Tweak.x", encoding="utf-8").read()
          blocks = re.findall(r'%hook\s+\w+(.*?)%end', src, re.S)
          bad = False
          for b in blocks:
              for m in ("insertSubview", "addSubview", "removeFromSuperview"):
                  if m in b:
                      print(f"❌ hook 块内出现 {m}（必须在稳定态 worker 里做，否则触发 layout 反馈环）")
                      bad = True
          if bad:
              sys.exit(1)
          print(f"✅ {len(blocks)} 个 hook 块均未在布局回调内改视图树")
          PY

      - name: Lint 必须存在运行时侦查（禁止纯硬编码私有类名）
        run: |
          set -e
          grep -q 'objc_copyClassList' WXGRecon.m \
            || { echo "❌ 缺少 objc_copyClassList 运行时侦查"; exit 1; }
          grep -q 'WXGReconCheckCandidates' Tweak.x \
            || { echo "❌ %ctor 里必须调用 WXGReconCheckCandidates（否则无从知道钩子挂没挂上）"; exit 1; }
          echo "✅ 运行时侦查齐备"

      - name: Lint 玻璃层必须 userInteractionEnabled = NO
        run: |
          set -e
          grep -q 'userInteractionEnabled = NO' WXGGlassView.m \
            || { echo "❌ 玻璃层必须 userInteractionEnabled = NO（否则可能挡住键盘触摸）"; exit 1; }
          echo "✅ 触摸安全"

      - name: Lint 禁止用字符串搜索断言包内 plist（二进制 plist 假阴性）
        run: |
          set -e
          python3 - <<'PY'
          import re, sys
          src = open(".github/workflows/build.yml", encoding="utf-8").read()
          # ⭐ 血泪：FINALPACKAGE=1 时 theos 把所有包内 plist 转成二进制（bplist00），
          #    此时 `"<key>X</key>" in blob` 恒为 False —— 包是对的、CI 却红。
          #    正确姿势：plistlib.loads(...) 后查键。
          # 只看非注释行，否则本 lint 会自己触发自己。
          code = "\n".join(l for l in src.split("\n") if not l.lstrip().startswith("#"))
          bad = re.findall(r'["\']<key>[^"\']*</key>["\']\s+in\s+', code)
          if bad:
              print("❌ Verify 里出现字符串搜索 plist 的写法（二进制 plist 必假阴性）：")
              for b in bad:
                  print("   ", b)
              print("   → 改用 plistlib.loads(bytes)[key]")
              sys.exit(1)
          if "plistlib" not in src:
              print("❌ Verify 必须用 plistlib 解析包内 plist")
              sys.exit(1)
          print("✅ plist 断言走 plistlib（无二进制假阴性）")
          PY

  # ────────────────────────────────────────────────────────────
  #  Stage 2：macOS 真编译（arm64e 必须 Apple 原生 clang+ld64）
  # ────────────────────────────────────────────────────────────
  build:
    needs: lint
    runs-on: macos-14
    steps:
      - name: Checkout tweak
        uses: actions/checkout@v4
        with:
          path: tweak

      - name: Install build deps
        run: |
          brew install make xz ldid

      - name: Clone roothide theos（必须这个分支才有 roothide scheme）
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git theos
          echo "THEOS=$PWD/theos" >> $GITHUB_ENV
          echo "$PWD/theos/bin" >> $GITHUB_PATH

      - name: Verify roothide scheme exists
        run: |
          set -e
          # ⭐ scheme 模块实际位置 = vendor/mod/roothide（不是 makefiles/package/）
          test -f "$THEOS/vendor/mod/roothide/package.mk" \
            || { echo "❌ vendor/mod/roothide/package.mk 不存在 —— theos 分支不对，必须 roothide/theos"; exit 1; }
          echo "✅ roothide scheme 就位（vendor/mod/roothide）"

      - name: Download SDK (iPhoneOS16.5)
        run: |
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git sdksrc
          cd sdksrc
          git sparse-checkout set iPhoneOS16.5.sdk
          git lfs pull || true
          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build deb
        run: |
          set -euo pipefail
          cd tweak
          # ⭐ macOS 必须用 brew 的 GNU Make（gmake），系统 make 太老会炸
          gmake clean || true
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1
          ls -la packages/

      - name: Verify deb (架构字段 + 内部布局 + arm64e 切片，纯 Python)
        run: |
          set -euo pipefail
          PYTHONUTF8=1 python3 - <<'PY'
          import tarfile, io, lzma, struct, sys, glob, plistlib

          debs = glob.glob("tweak/packages/*.deb")
          assert debs, "❌ 没有找到 deb 产物"
          deb = debs[0]
          print("deb =", deb)

          # ---- 解析 ar 归档 ----
          with open(deb, "rb") as f:
              magic = f.read(8)
              assert magic == b"!<arch>\n", "❌ 不是 ar 归档"
              members = {}
              while True:
                  hdr = f.read(60)
                  if len(hdr) < 60: break
                  name = hdr[:16].decode().strip()
                  size = int(hdr[48:58].decode().strip())
                  body = f.read(size)
                  if size % 2: f.read(1)
                  members[name] = body

          # ---- 1. control: Architecture 断言 ----
          ctrl_name = next(n for n in members if n.startswith("control.tar"))
          ct = tarfile.open(fileobj=io.BytesIO(members[ctrl_name]))
          ctrl = b""
          for m in ct.getmembers():
              if m.name.lstrip("./") in ("control", "control"):
                  ctrl = ct.extractfile(m).read(); break
          ctrl_text = ctrl.decode()
          print("--- control ---"); print(ctrl_text)
          assert "Architecture: iphoneos-arm64e" in ctrl_text, "❌ 架构不是 iphoneos-arm64e"
          # ⭐ 版本从源码单一来源推导，禁止硬编码（否则每次升版 CI 假红）
          import re as _re
          _h = open("tweak/WXGCommon.h", encoding="utf-8").read()
          m = _re.search(r'WXG_VERSION\s+@"([0-9.]+)"', _h)
          assert m, "❌ 没从 WXGCommon.h 取到 WXG_VERSION"
          want_ver = m.group(1)
          assert f"Version: {want_ver}" in ctrl_text, f"❌ deb 版本不是 {want_ver}（期望与源码一致）"
          print(f"✅ Architecture: iphoneos-arm64e / Version: {want_ver}")

          # ---- 2. data: 布局断言 ----
          data_name = next(n for n in members if n.startswith("data.tar"))
          raw = members[data_name]
          # lzma alone 格式优先（theos 默认），失败再试 xz/gz
          try:
              dt = tarfile.open(fileobj=io.BytesIO(raw), mode="r:xz")
          except Exception:
              try:
                  dt = tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw, format=lzma.FORMAT_ALONE)))
              except Exception:
                  dt = tarfile.open(fileobj=io.BytesIO(raw), mode="r:*")
          names = [m.name.lstrip("./") for m in dt.getmembers()]
          paths = "\n".join(names)

          for need in (
              "Library/PreferenceLoader/Preferences/WXGlass.plist",
              "Library/PreferenceBundles/WXGlassPrefs.bundle/WXGlassPrefs",
              "Library/PreferenceBundles/WXGlassPrefs.bundle/Info.plist",
              "Library/PreferenceBundles/WXGlassPrefs.bundle/Settings.plist",
              "Library/MobileSubstrate/DynamicLibraries/WXGlass.dylib",
              "Library/MobileSubstrate/DynamicLibraries/WXGlass.plist",
          ):
              assert need in paths, f"❌ 包内缺少 {need}"
          print("✅ 入口 plist / prefs bundle(含 Info.plist) / tweak dylib / filter plist 齐全")

          # ---- 2b. bundle Info.plist 必须真的含 NSPrincipalClass ----
          # ⭐ 历史坑1：Info.plist 放在 Preferences/ 根目录不会被打进 bundle，
          #    结果包内有控制器二进制但无 NSPrincipalClass → 设置入口点进去白屏。
          # ⭐ 历史坑2：FINALPACKAGE=1 时 theos bin/convert_xml_plist.sh 会把包内
          #    所有 plist 转成 **二进制 plist**（bplist00），此时用字符串搜
          #    "<key>NSPrincipalClass</key>" 永远搜不到 —— 必须用 plistlib 解析，
          #    否则就是「包明明是对的、CI 却红」的假阴性。
          def _read_plist(member_name):
              _m = next(m for m in dt.getmembers()
                        if m.name.lstrip("./") == member_name)
              return plistlib.loads(dt.extractfile(_m).read())

          _bundle_info = _read_plist("Library/PreferenceBundles/WXGlassPrefs.bundle/Info.plist")
          print("bundle Info.plist keys =", sorted(_bundle_info.keys()))
          assert _bundle_info.get("NSPrincipalClass"), "❌ bundle Info.plist 缺 NSPrincipalClass 键"
          assert _bundle_info["NSPrincipalClass"] == "WXGlassPrefsListController", (
              f"❌ NSPrincipalClass 不是 WXGlassPrefsListController（实际 {_bundle_info['NSPrincipalClass']}）")
          assert _bundle_info.get("CFBundleExecutable") == "WXGlassPrefs", (
              f"❌ CFBundleExecutable 不是 WXGlassPrefs（实际 {_bundle_info.get('CFBundleExecutable')}）")
          print("✅ bundle Info.plist 含 NSPrincipalClass = WXGlassPrefsListController")

          # ---- 2c. 入口 plist 必须是 entry 包裹结构（PreferenceLoader 只认这种） ----
          # ⭐ 扁平字典会被 PreferenceLoader 静默跳过 → 设置里完全没入口。
          _entry = _read_plist("Library/PreferenceLoader/Preferences/WXGlass.plist")
          assert "entry" in _entry, "❌ 入口 plist 顶层缺少 entry 键（扁平字典会被跳过）"
          _e = _entry["entry"]
          for _k in ("bundle", "cell", "detail", "isController", "label"):
              assert _k in _e, f"❌ 入口 plist entry 缺 {_k} 键"
          assert _e["bundle"] == "WXGlassPrefs", f"❌ entry.bundle 不是 WXGlassPrefs（实际 {_e.get('bundle')}）"
          assert _e["detail"] == "WXGlassPrefsListController", (
              f"❌ entry.detail 不是 WXGlassPrefsListController（实际 {_e.get('detail')}）")
          assert _e["isController"] in (True, "true", "YES", "1", 1), "❌ entry.isController 不是真值"
          print(f"✅ 入口 plist entry 包裹正确（bundle={_e['bundle']} detail={_e['detail']}）")

          # ---- 2d. 注入过滤清单必须含 Executables ----
          # ⭐ v0.2.0 血泪：微信输入法键盘是 app extension，跑在独立进程；
          #    扩展进程的 mainBundle 在不同 iOS 版本下可能是宿主/扩展/临时容器，
          #    只靠 Filter.Bundles 会漏注入 → 用户侧表现「装了完全没反应」。
          #    Filter.Executables（按进程名匹配）是扩展进程最可靠的一条，必须有。
          _flt = _read_plist("Library/MobileSubstrate/DynamicLibraries/WXGlass.plist")
          _f = _flt.get("Filter", {})
          assert "Bundles" in _f, "❌ filter plist 缺 Filter.Bundles"
          assert "Executables" in _f, (
              "❌ filter plist 缺 Filter.Executables（键盘扩展进程可能注入不到）")
          assert any("wetype" in b for b in _f["Bundles"]), (
              f"❌ Filter.Bundles 未覆盖 wetype（实际 {_f['Bundles']}）")
          print(f"✅ filter plist: Bundles={_f['Bundles']}")
          print(f"✅ filter plist: Executables={_f['Executables']}")

          # ---- 3. dylib 切片断言：必须含 arm64e (cpusubtype 0x80000002) ----
          # ⭐ cpusubtype 必须按无符号解析（0x80000002 有符号 = -2147483646，比较永远失败）
          def has_arm64e(blob):
              if blob[:4] == b"\xca\xfe\xba\xbe":  # fat 32（大端，arch 头 20B）
                  n = struct.unpack(">I", blob[4:8])[0]
                  for i in range(n):
                      ct, sub = struct.unpack(">II", blob[8+20*i:16+20*i])
                      if ct == 0x0100000C and sub == 0x80000002: return True
                  return False
              if blob[:4] == b"\xca\xfe\xba\xbf":  # fat 64（大端，arch 头 32B）
                  n = struct.unpack(">I", blob[4:8])[0]
                  for i in range(n):
                      ct, sub = struct.unpack(">II", blob[8+32*i:16+32*i])
                      if ct == 0x0100000C and sub == 0x80000002: return True
                  return False
              if struct.unpack("<I", blob[:4])[0] == 0xfeedfacf:  # thin 64（小端）
                  ct, sub = struct.unpack("<II", blob[4:12])
                  return ct == 0x0100000C and sub == 0x80000002
              return False

          for m in dt.getmembers():
              if m.name.endswith("DynamicLibraries/WXGlass.dylib"):
                  blob = dt.extractfile(m).read()
                  assert has_arm64e(blob), "❌ dylib 缺 arm64e 切片"
                  print(f"✅ WXGlass.dylib 含 arm64e 切片（{len(blob)}B）")
                  break

          # ---- 4. prefs bundle 二进制也查 arm64e ----
          for m in dt.getmembers():
              if m.name.endswith("WXGlassPrefs.bundle/WXGlassPrefs"):
                  blob = dt.extractfile(m).read()
                  assert has_arm64e(blob), "❌ prefs bundle 二进制缺 arm64e 切片"
                  print(f"✅ WXGlassPrefs bundle 含 arm64e 切片（{len(blob)}B）")
                  break

          print("🎉 deb 全部校验通过")
          PY

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: wxglass-deb
          path: tweak/packages/*.deb
          if-no-files-found: error
